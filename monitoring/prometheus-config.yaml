# Prometheus configuration, mounted into the Prometheus pod at /etc/prometheus.
#
# What this collects (only endpoints that actually exist in this setup):
#   - prometheus           : Prometheus' own metrics
#   - grafana              : Grafana's built-in /metrics endpoint
#   - kubernetes-apiserver : EKS API server metrics
#   - kubernetes-cadvisor  : per-container CPU/memory/network usage from each node's kubelet
#
# Not collected: the frontend's Nginx has no metrics endpoint (would need nginx-prometheus-exporter),
# and node-level OS metrics such as disk or load would need node-exporter.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: grafana
        static_configs:
          - targets: ["grafana:3000"]

      - job_name: kubernetes-apiserver
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: ["kubernetes.default.svc:443"]

      # Reaches each node's kubelet through the API server proxy
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
